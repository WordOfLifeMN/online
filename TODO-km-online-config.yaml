# Anthropic API key for the church's own Console account.
#
# This is read from the config file and handed to this process only. Do NOT set
# ANTHROPIC_API_KEY as a user-wide environment variable - it would shadow the
# credentials Claude Code and other tools on this machine use.
#
# There is deliberately no command line flag for it, so it stays out of shell
# history and the process list. Keep this file out of version control.
anthropic-api-key: sk-ant-paste-the-church-key-here

# Model used to generate titles and descriptions. Compared against claude-opus-5
# on a real 80 minute service: both captured the same content, but Opus ran ~35%
# longer, changed its title every run, and one run in two emitted an undecoded
# unicode escape into the description. Haiku is steadier and about a fifth the cost.
anthropic-model: claude-haiku-4-5

# Transcription model. Measured over a full 80 minute service: small takes about
# 3 minutes and its transcript summarises identically to large-v3, which takes 18.
# NEVER use tiny.en - it writes an empty transcript while reporting success.
whisper-model: small

# Where the intermediate .mp3 and transcript are written before being deleted
scratch-dir: ~/.wolm/scratch

# Where the generic fallback thumbnails live, used only when a message has no
# artwork of its own beside the video. Files are named "WOL Thumbnail - <Type>.jpg"
# - currently Message and Prayer - and a type with no file of its own falls back to
# "WOL Thumbnail - Message.jpg". Leave unset for no fallback at all.
thumb-dir: C:\Users\WordofLifeMNMedia\Documents\WOLMessages
